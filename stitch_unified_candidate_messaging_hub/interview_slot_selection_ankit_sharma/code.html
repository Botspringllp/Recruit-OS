<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            font-family: 'Inter', sans-serif;

        }

            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
        }

            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full h-16 bg-surface flex justify-between items-center px-margin-mobile z-50 border-b border-outline-variant transition-colors duration-200">
<div class="flex items-center gap-4">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-low p-2 rounded-full transition-colors" data-icon="arrow_back">arrow_back</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary truncate max-w-[200px] md:max-w-none">
                TechCorp — Round 1 Video Interview
            </h1>
</div>
<div class="flex items-center">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-low p-2 rounded-full transition-colors" data-icon="more_vert">more_vert</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile max-w-container-max mx-auto w-full">
<!-- Greeting Section -->
<section class="mb-stack-lg animate-in fade-in slide-in-from-bottom-4 duration-500">
<div class="bg-surface-container-lowest p-stack-md rounded-xl border border-outline-variant shadow-soft">
<div class="flex items-center gap-stack-sm mb-stack-xs">
<span class="w-2 h-8 bg-secondary-container rounded-full"></span>
<h2 class="font-headline-md text-headline-md text-on-surface">Hello Ankit</h2>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Please select one slot that works best for you:
                </p>
</div>
</section>
<!-- Slot Selection Grid (Asymmetric feel with full-width cards) -->
<div class="space-y-stack-md">
<!-- Slot Card 1 -->
<label class="block cursor-pointer group">
<input class="hidden peer" name="slot" type="radio"/>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md flex items-center justify-between shadow-soft peer-checked:bg-secondary-container peer-checked:border-primary transition-all-custom hover:border-primary/50">
<div class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors">Wed, 14 Oct</span>
<span class="font-headline-md text-headline-md font-bold text-primary">3:00 PM IST</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="material-symbols-outlined text-[18px] text-on-primary opacity-0 peer-checked:opacity-100" data-icon="check" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
</label>
<!-- Slot Card 2 (PRE-SELECTED / HIGHLIGHTED) -->
<label class="block cursor-pointer group">
<input checked="" class="hidden peer" name="slot" type="radio"/>
<div class="bg-secondary-container border-2 border-primary rounded-xl p-stack-md flex items-center justify-between shadow-lg transition-all-custom ring-2 ring-secondary-container/20">
<div class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-primary/80">Thu, 15 Oct</span>
<span class="font-headline-md text-headline-md font-bold text-primary">11:00 AM IST</span>
</div>
<div class="w-7 h-7 rounded-full bg-primary flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-[20px] text-secondary-container" data-icon="check" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
</label>
<!-- Slot Card 3 -->
<label class="block cursor-pointer group">
<input class="hidden peer" name="slot" type="radio"/>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-stack-md flex items-center justify-between shadow-soft peer-checked:bg-secondary-container peer-checked:border-primary transition-all-custom hover:border-primary/50">
<div class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-primary transition-colors">Fri, 16 Oct</span>
<span class="font-headline-md text-headline-md font-bold text-primary">4:00 PM IST</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary transition-all">
<span class="material-symbols-outlined text-[18px] text-on-primary opacity-0 peer-checked:opacity-100" data-icon="check" style="font-variation-settings: 'wght' 700;">check</span>
</div>
</div>
</label>
</div>
<!-- Decorative Visual Element -->
<div class="mt-stack-lg opacity-40 grayscale group-hover:grayscale-0 transition-all duration-700">
<div class="rounded-xl overflow-hidden h-48 relative border border-outline-variant">
<div class="bg-cover bg-center w-full h-full" data-alt="A professional modern office environment with high-end glass partitions and soft warm lighting. The aesthetic is clean and corporate, featuring minimalist white desks and dark navy accent walls. A digital screen in the background shows a blurred recruitment portal interface. The mood is welcoming yet professional." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCbFKI6qSxmZay9Tt0xbXM-q3GZ6JoLRZQ_qEEElqLJYX8hPK7jG5pbkN0B0Cp_0ig3ju-Pf8okTzL5cb56MOQ1xBPsrwXsYTMWataGpLT72mODCCfPE6zUOYANUPwtfWjrasiq-qRgvSyHzJctkGMO-eXkhAoIsgm0u28kBTCzKXZys8By3JTpxd56znxclaK3TcuIdan9Righ404NeOQ0bVMm6wPcxLgrqgj_l5qAyLC1YbxRXbXX')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-background to-transparent"></div>
</div>
</div>
</main>
<!-- Sticky Bottom Footer for Action -->
<footer class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-white/80 backdrop-blur-md border-t border-outline-variant z-40">
<div class="max-w-container-max mx-auto">
<button class="w-full bg-secondary-container text-primary font-bold py-4 rounded-lg shadow-md hover:shadow-lg active:scale-[0.98] transition-all-custom flex items-center justify-center gap-2 group" onclick="handleConfirm()">
<span class="font-label-md text-label-md uppercase tracking-wider">Confirm Interview Slot</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</footer>
<!-- BottomNavBar (Hidden per 'Task-Focused' suppression rule but defined in JSON) -->
<!-- Suppressed for checkout/focused transaction state -->
<script>
        // Simple Interaction Logic
        function handleConfirm() {
            const btn = document.querySelector('button[onclick="handleConfirm()"]');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = `
                <div class="flex items-center gap-2">
                    <svg class="animate-spin h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span class="font-label-md text-label-md uppercase">Processing...</span>
                </div>
            `;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            setTimeout(() => {
                btn.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
                        <span class="font-label-md text-label-md uppercase">Slot Confirmed!</span>
                    </div>
                `;
                btn.classList.remove('bg-secondary-container');
                btn.classList.add('bg-green-500', 'text-white');
            }, 1500);
        }

        // Visual selection handler for better UI feedback
        document.querySelectorAll('input[name="slot"]').forEach(input => {
            input.addEventListener('change', (e) => {
                // Reset all
                document.querySelectorAll('input[name="slot"]').forEach(i => {
                    const card = i.nextElementSibling;
                    card.classList.remove('bg-secondary-container', 'border-primary', 'shadow-lg', 'border-2', 'ring-2', 'ring-secondary-container/20');
                    card.classList.add('bg-surface-container-lowest', 'border-outline-variant', 'shadow-soft');
                    
                    const labelSpan = card.querySelector('span:first-child');
                    labelSpan.classList.add('text-on-surface-variant');
                    labelSpan.classList.remove('text-primary/80');

                    const iconContainer = card.querySelector('.rounded-full');
                    iconContainer.classList.remove('w-7', 'h-7', 'bg-primary', 'shadow-md');
                    iconContainer.classList.add('w-6', 'h-6', 'border-2', 'border-outline-variant');
                });

                // Set Active
                if(e.target.checked) {
                    const card = e.target.nextElementSibling;
                    card.classList.add('bg-secondary-container', 'border-primary', 'shadow-lg', 'border-2', 'ring-2', 'ring-secondary-container/20');
                    card.classList.remove('bg-surface-container-lowest', 'border-outline-variant', 'shadow-soft');

                    const labelSpan = card.querySelector('span:first-child');
                    labelSpan.classList.remove('text-on-surface-variant');
                    labelSpan.classList.add('text-primary/80');

                    const iconContainer = card.querySelector('.rounded-full');
                    iconContainer.classList.add('w-7', 'h-7', 'bg-primary', 'shadow-md');
                    iconContainer.classList.remove('w-6', 'h-6', 'border-2', 'border-outline-variant');
                }
            });
        });
    </script>
</body></html>
