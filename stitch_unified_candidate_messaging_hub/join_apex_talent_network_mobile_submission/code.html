<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Apex Recruitment - Join Talent Network</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#d3e4fe",
                    "secondary-container": "#fed400",
                    "secondary": "#715d00",
                    "inverse-primary": "#bec6e0",
                    "error": "#ba1a1a",
                    "surface-container": "#e5eeff",
                    "tertiary-container": "#001e2c",
                    "primary-container": "#131b2e",
                    "outline": "#76777d",
                    "primary-fixed": "#dae2fd",
                    "on-tertiary-container": "#008ebf",
                    "on-primary": "#ffffff",
                    "surface-container-lowest": "#ffffff",
                    "surface-bright": "#f8f9ff",
                    "on-primary-fixed-variant": "#3f465c",
                    "surface-container-high": "#dce9ff",
                    "surface-dim": "#cbdbf5",
                    "tertiary": "#000000",
                    "primary-fixed-dim": "#bec6e0",
                    "on-tertiary-fixed-variant": "#004c69",
                    "on-surface-variant": "#45464d",
                    "secondary-fixed": "#ffe177",
                    "outline-variant": "#c6c6cd",
                    "on-error": "#ffffff",
                    "on-secondary-fixed-variant": "#554500",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#6f5c00",
                    "primary": "#000000",
                    "on-primary-container": "#7c839b",
                    "on-surface": "#0b1c30",
                    "background": "#f8f9ff",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#eaf1ff",
                    "secondary-fixed-dim": "#ebc300",
                    "inverse-surface": "#213145",
                    "tertiary-fixed": "#c4e7ff",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#eff4ff",
                    "on-secondary": "#ffffff",
                    "on-secondary-fixed": "#231b00",
                    "surface-tint": "#565e74",
                    "on-tertiary-fixed": "#001e2c",
                    "on-primary-fixed": "#131b2e",
                    "tertiary-fixed-dim": "#7bd0ff",
                    "on-background": "#0b1c30",
                    "surface-container-highest": "#d3e4fe",
                    "surface": "#f8f9ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "gutter": "24px",
                    "stack-xs": "4px",
                    "margin-mobile": "16px",
                    "stack-md": "16px",
                    "stack-lg": "24px",
                    "stack-sm": "8px",
                    "sidebar-width": "280px",
                    "margin-desktop": "32px",
                    "container-max": "1440px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"],
                    "body-sm": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "body-md": ["Inter"],
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "display-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom halo focus effect from style guide */
        .input-focus-halo:focus-within {
            border-color: #000000;
            box-shadow: 0 0 0 2px rgba(254, 212, 0, 0.2);
        }

        /* Modal specific animations */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dropzone-active {
            border-color: #000000;
            background-color: #f1f5f9;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden">
<!-- Modal Backdrop -->
<div class="fixed inset-0 bg-primary-container/40 backdrop-blur-sm z-[100] flex items-end md:items-center justify-center">
<!-- Main Modal Container -->
<div class="bg-surface-container-lowest w-full max-w-lg h-[813px] md:h-auto md:max-h-[751px] rounded-t-xl md:rounded-xl shadow-2xl flex flex-col animate-slide-up overflow-hidden relative">
<!-- Sticky Header (TopAppBar logic) -->
<header class="bg-primary px-margin-mobile h-16 flex justify-between items-center z-20 sticky top-0">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">person_add</span>
<h1 class="text-secondary-container font-headline-md-mobile text-headline-md-mobile">Join Apex Talent Network</h1>
</div>
<button class="p-2 text-secondary-container hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined">close</span>
</button>
</header>
<!-- Scrollable Form Area -->
<div class="flex-1 overflow-y-auto p-margin-mobile space-y-stack-lg pb-32">
<!-- Introduction Branding -->
<div class="mb-stack-lg">
<p class="text-on-surface-variant font-body-md">Connect with top-tier enterprise opportunities. Submit your professional profile to our global recruitment database.</p>
</div>
<form class="space-y-stack-md" id="applicationForm">
<!-- Full Name -->
<div class="space-y-stack-xs group">
<label class="text-label-md font-label-md text-on-surface-variant group-focus-within:text-primary transition-colors">Full Name</label>
<div class="flex items-center border border-outline-variant rounded bg-white px-3 h-12 input-focus-halo transition-all">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">person</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-on-surface placeholder:text-outline/50 font-body-md" placeholder="John Doe" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-stack-xs group">
<label class="text-label-md font-label-md text-on-surface-variant group-focus-within:text-primary transition-colors">Email</label>
<div class="flex items-center border border-outline-variant rounded bg-white px-3 h-12 input-focus-halo transition-all">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">mail</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-on-surface placeholder:text-outline/50 font-body-md" placeholder="john@example.com" type="email"/>
</div>
</div>
<!-- Grid for Phone & Designation -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Phone -->
<div class="space-y-stack-xs group">
<label class="text-label-md font-label-md text-on-surface-variant group-focus-within:text-primary transition-colors">Phone</label>
<div class="flex items-center border border-outline-variant rounded bg-white px-3 h-12 input-focus-halo transition-all">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">call</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-on-surface placeholder:text-outline/50 font-body-md" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<!-- Designation -->
<div class="space-y-stack-xs group">
<label class="text-label-md font-label-md text-on-surface-variant group-focus-within:text-primary transition-colors">Desired Designation</label>
<div class="flex items-center border border-outline-variant rounded bg-white px-3 h-12 input-focus-halo transition-all">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">badge</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-on-surface placeholder:text-outline/50 font-body-md" placeholder="Senior Product Designer" type="text"/>
</div>
</div>
</div>
<!-- Notice Period -->
<div class="space-y-stack-xs group">
<label class="text-label-md font-label-md text-on-surface-variant group-focus-within:text-primary transition-colors">Notice Period (Days)</label>
<div class="flex items-center border border-outline-variant rounded bg-white px-3 h-12 input-focus-halo transition-all">
<span class="material-symbols-outlined text-outline mr-2 text-[20px]">calendar_today</span>
<input class="w-full bg-transparent border-none focus:ring-0 p-0 text-on-surface placeholder:text-outline/50 font-body-md" placeholder="30" type="number"/>
</div>
</div>
<!-- Document Upload Dropzone -->
<div class="pt-stack-sm">
<label class="text-label-md font-label-md text-on-surface-variant mb-stack-xs block">Resume Upload</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl bg-surface-container-low p-stack-lg flex flex-col items-center justify-center text-center cursor-pointer hover:border-primary transition-all group active:scale-[0.99]" id="dropzone">
<div class="w-16 h-16 bg-white rounded-full shadow-sm flex items-center justify-center mb-stack-md group-hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="description">description</span>
</div>
<h4 class="font-label-md text-on-surface text-label-md mb-stack-xs">Drag &amp; Drop Resume</h4>
<p class="text-on-surface-variant text-body-sm">(PDF or DOCX, Max 10MB)</p>
<input accept=".pdf,.docx" class="hidden" id="fileInput" type="file"/>
</div>
</div>
</form>
</div>
<!-- Fixed Footer Action -->
<footer class="absolute bottom-0 left-0 w-full p-margin-mobile bg-white/80 backdrop-blur-md border-t border-outline-variant z-30">
<button class="w-full h-14 bg-primary text-secondary-container font-label-md text-label-md rounded shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform uppercase tracking-widest" form="applicationForm" type="submit">
<span>Submit Application</span>
<span class="material-symbols-outlined text-[20px]">send</span>
</button>
</footer>
</div>
</div>
<!-- Background Decoration (Ambient Visual) -->
<div class="fixed inset-0 -z-10 bg-surface flex items-center justify-center opacity-30 overflow-hidden">
<div class="w-full h-full max-w-container-max relative">
<div class="absolute top-1/4 -left-20 w-96 h-96 bg-secondary-container/10 rounded-full blur-3xl"></div>
<div class="absolute bottom-1/4 -right-20 w-96 h-96 bg-primary-container/5 rounded-full blur-3xl"></div>
<!-- High-end UI Grid Pattern -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: linear-gradient(#000 1px, transparent 1px), linear-gradient(90deg, #000 1px, transparent 1px); background-size: 40px 40px;"></div>
</div>
</div>
<script>
        // Micro-interactions for form and dropzone
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');

        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dropzone-active', 'ring-2', 'ring-secondary-container');
        });

        ['dragleave', 'drop'].forEach(evt => {
            dropzone.addEventListener(evt, () => {
                dropzone.classList.remove('dropzone-active', 'ring-2', 'ring-secondary-container');
            });
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const fileName = e.target.files[0].name;
                const uploadText = dropzone.querySelector('h4');
                uploadText.innerText = `Selected: ${fileName}`;
                uploadText.classList.add('text-secondary');
                dropzone.querySelector('.w-16').classList.add('bg-secondary-container');
            }
        });

        // Form Submit Interaction
        document.getElementById('applicationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Processing...</span>';
            btn.disabled = true;
            
            // Mock success
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>Application Sent</span>';
                btn.classList.replace('bg-primary', 'bg-secondary-container');
                btn.classList.replace('text-secondary-container', 'text-on-secondary-container');
            }, 1500);
        });
    </script>
</body></html>
